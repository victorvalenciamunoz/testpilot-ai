name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Compilar y ejecutar tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore src/TestPilot.slnx

      - name: Compilar
        run: dotnet build src/TestPilot.slnx --configuration Release --no-restore

      # Los tests de integración levantan proyectos .NET temporales en disco y algunos
      # necesitan una clave de API, así que en CI solo se ejecutan los unitarios.
      - name: Ejecutar tests unitarios
        run: >
          dotnet test src/TestPilot.slnx
          --configuration Release
          --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Publicar resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
